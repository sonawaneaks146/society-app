/* ================= PDF (drawn on canvas, so Marathi text shapes correctly) ================= */
async function renderPdf(rep){
  
  const W = 1240, H = 1754, M = 64, FONT = '"Noto Sans Devanagari", "Nirmala UI", Mangal, sans-serif', pages = [];
  let cv, cx, y;
  const newPage = () => { cv = document.createElement('canvas'); cv.width = W; cv.height = H; cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,W,H); pages.push(cv); y = M; };
  const font = (sz, w = 400, f = FONT) => { cx.font = w + ' ' + sz + 'px ' + f; };
  const wrap = (t, w) => {
    const out = []; let line = '';
    for (const tok of String(t).split(/(\s+)/)){
      if (cx.measureText(line + tok).width <= w){ line += tok; continue; }
      if (line.trim()) out.push(line.trim()); line = '';
      if (cx.measureText(tok).width <= w){ line = tok.trimStart(); continue; }
      for (const ch of tok){ if (cx.measureText(line + ch).width > w){ out.push(line); line = ''; } line += ch; }
    }
    if (line.trim() || !out.length) out.push(line.trim());
    return out;
  };
  const tw = W - 2 * M, parts = rep.parts || [rep]; let cur = parts[0], cw = [];
  const setCur = p => { cur = p; const tot = p.cols.reduce((a,c) => a + c[1], 0); cw = p.cols.map(c => tw * c[1] / tot); };
  setCur(parts[0]);
  const drawRow = (cells, o) => {
    font(o.size, o.bold ? 700 : 400);
    const lines = cells.map((c,i) => wrap(c, cw[i] - 20)), h = Math.max(...lines.map(l => l.length)) * (o.size + 8) + 16;
    return {lines, h};
  };
  const paintRow = (cells, o, r) => {
    if (o.bg){ cx.fillStyle = o.bg; cx.fillRect(M, y, tw, r.h); }
    cx.fillStyle = o.color || '#14232B'; font(o.size, o.bold ? 700 : 400);
    let x = M;
    r.lines.forEach((ls, i) => { ls.forEach((ln, j) => { cx.textAlign = cur.cols[i][2] === 'r' ? 'right' : 'left'; cx.fillText(ln, cur.cols[i][2] === 'r' ? x + cw[i] - 10 : x + 10, y + 8 + (j + 1) * (o.size + 8) - 6); }); x += cw[i]; });
    cx.textAlign = 'left'; cx.strokeStyle = '#D9E1E0'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(M, y + r.h); cx.lineTo(M + tw, y + r.h); cx.stroke(); y += r.h;
  };
  newPage();
  cx.fillStyle = '#0B4F4A'; font(46, 700); cx.fillText('सर्वज्ञ सोसायटी, दत्तवाडी, मानेगाव', M, y + 44); y += 70;
  cx.fillStyle = '#14232B'; font(34, 700); cx.fillText(rep.title, M, y + 30); y += 46;
  cx.fillStyle = '#5C6E75'; font(26); wrap(rep.sub, tw).forEach(l => { cx.fillText(l, M, y + 26); y += 36; }); y += 10;
  if (rep.sum && rep.sum.length){
    const bw = (tw - 20) / 2;
    for (let i = 0; i < rep.sum.length; i += 2){
      [0,1].forEach(j => { const s = rep.sum[i + j]; if (!s) return; const x = M + j * (bw + 20);
        cx.fillStyle = '#EEF2F1'; cx.fillRect(x, y, bw, 78); cx.fillStyle = '#5C6E75'; font(22); cx.fillText(s[0], x + 16, y + 30);
        cx.fillStyle = '#0B4F4A'; font(30, 700); cx.fillText(s[1], x + 16, y + 64); });
      y += 92;
    }
    y += 6;
  }
  const head = () => { const hc = cur.cols.map(c => c[0]), r = drawRow(hc, {size:22, bold:true}); if (y + r.h > H - M - 50) newPage(); paintRow(hc, {size:22, bold:true, bg:'#DCEFEC', color:'#0B4F4A'}, r); };
  parts.forEach((pt, pi) => {
    setCur(pt);
    if (rep.parts){
      if (y + 140 > H - M - 50) newPage(); else y += 18;
      cx.fillStyle = '#0B4F4A'; font(30, 700); cx.fillText(pt.title || '', M, y + 30); y += 48;
      if (!pt.rows.length){ cx.fillStyle = '#5C6E75'; font(24); cx.fillText('या कालावधीत नोंदी नाहीत.', M, y + 24); y += 40; return; }
    }
    head();
    pt.rows.forEach(row => {
      const cells = row.map(String), r = drawRow(cells, {size:22});
      if (y + r.h > H - M - 50){ newPage(); head(); }
      paintRow(cells, {size:22}, r);
    });
    if (pt.foot){ const cells = pt.foot.map(String), r = drawRow(cells, {size:22, bold:true}); if (y + r.h > H - M - 50){ newPage(); head(); } paintRow(cells, {size:22, bold:true, bg:'#EEF2F1'}, r); }
  });
  pages.forEach((p, i) => { const c = p.getContext('2d'); c.fillStyle = '#5C6E75'; c.font = '400 20px ' + FONT; c.textAlign = 'left';
    c.fillText('तयार केले: ' + dlabel(today()) + ' · सर्वज्ञ सोसायटी', M, H - 36); c.textAlign = 'right'; c.fillText('पान ' + (i + 1) + ' / ' + pages.length, W - M, H - 36); });
  return pdfFromCanvases(pages);
}
function pdfFromCanvases(pages){
  const enc = s => new TextEncoder().encode(s), chunks = [], offs = []; let off = 0;
  const w = b => { chunks.push(b); off += b.length; }, ws = s => w(enc(s));
  const obj = (id, fn) => { offs[id] = off; ws(id + ' 0 obj\n'); fn(); ws('\nendobj\n'); };
  const n = pages.length;
  ws('%PDF-1.4\n');
  obj(1, () => ws('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => ws('<< /Type /Pages /Kids [' + pages.map((_, i) => (5 + 3 * i) + ' 0 R').join(' ') + '] /Count ' + n + ' >>'));
  pages.forEach((cv, i) => {
    const bin = atob(cv.toDataURL('image/jpeg', 0.9).split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    obj(3 + 3 * i, () => { ws('<< /Type /XObject /Subtype /Image /Width ' + cv.width + ' /Height ' + cv.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bytes.length + ' >>\nstream\n'); w(bytes); ws('\nendstream'); });
    const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(4 + 3 * i, () => ws('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
    obj(5 + 3 * i, () => ws('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + (3 + 3 * i) + ' 0 R >> >> /Contents ' + (4 + 3 * i) + ' 0 R >>'));
  });
  const total = 3 + 3 * n, xref = off;
  ws('xref\n0 ' + total + '\n0000000000 65535 f \n');
  for (let id = 1; id < total; id++) ws(String(offs[id]).padStart(10, '0') + ' 00000 n \n');
  ws('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, {type:'application/pdf'});
}
function waLink(mobile, text){
  let d = String(mobile || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);

async function exportPdf(rep, fname){
  try {
    if (!S.dl) return toast('या दृश्यात PDF सेव्ह होत नाही');

}

/* ================= bar chart ================= */
function barChart(C){
  if (!C.keys.length) return '';
  const last = C.keys[C.keys.length-1]; let [y,m] = last.split('-').map(Number); const win = [];
  for (let i = 0; i < 12; i++){ win.unshift(y + '-' + String(m).padStart(2,'0')); m--; if (m === 0){ m = 12; y--; } }
  const data = win.map(k => ({k, a:(C.months[k]||{}).inst||0, b:(C.months[k]||{}).loan||0}));
  const max = Math.max(1, ...data.flatMap(d => [d.a, d.b]));
  const step = Math.pow(10, Math.floor(Math.log10(max))); let top = Math.ceil(max/step)*step; if (top/step < 3) top = Math.ceil(max/(step/2))*(step/2);
  const W = 360, H = 190, L = 38, B = 24, T = 8, pw = W - L - 6, ph = H - B - T, gw = pw/12; let g = '';
  for (let i = 0; i <= 4; i++){ const v = top*i/4, yy = T + ph - ph*i/4;
    g += `<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${yy+3.5}" font-size="9.5" text-anchor="end">${v >= 100000 ? (v/100000)+'L' : v >= 1000 ? (v/1000)+'k' : v}</text>`; }
  data.forEach((d,i) => { const x = L + i*gw, bw = gw*0.32, h1 = ph*d.a/top, h2 = ph*d.b/top;
    g += `<rect x="${x+gw*0.14}" y="${T+ph-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--accent)"/><rect x="${x+gw*0.14+bw+1.5}" y="${T+ph-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--gold)"/>`;
    g += `<text x="${x+gw/2}" y="${H-8}" font-size="8.5" text-anchor="middle">${MSHORT[+d.k.slice(5)-1]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="महिन्यानुसार बचत आणि कर्ज">${g}</svg>`;
}

/* live total + interest difference text (no re-render, so typing is never interrupted) */
function updateHint(){

}

      <div><span>गुंतवणूक व्याज</span><b>${inr(m.invint)}</b></div><div><span>खर्च / बोनस</span><b>${inr(m.exp)} / ${inr(m.bonus)}</b></div>
      <div><span>महिना अखेर शिल्लक</span><b>${inr(m.cash)}</b></div><div><span>येणे कर्ज</span><b class="${m.out > 0 ? 'due' : ''}">${inr(m.out)}</b></div></div></div></button>${list}</div>`; }).join('');
}

async function pfSave(acc){

function pickPhoto(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => { const s = 240, c = document.createElement('canvas'), r = Math.min(im.width, im.height); c.width = c.height = s; c.getContext('2d').drawImage(im, (im.width - r) / 2, (im.height - r) / 2, r, r, 0, 0, s, s); S.pPhoto = c.toDataURL('image/jpeg', 0.72); render(); }; im.onerror = () => toast('फोटो उघडता आला नाही'); im.src = fr.result; };
  fr.readAsDataURL(file);
}

function editSpec(c, d){
  const dt = ['date', 'date', 'तारीख', d.date], amt = (l, v) => ['amt', 'num', l, v], mode = ['mode', 'mode', 'पद्धत', d.mode || 'रोख'], note = ['note', 'txt', 'टीप', d.note || ''];
  if (c === 'tx'){
    if (d.type === 'inst') return {title:'बचत नोंद संपादन', f:[dt, amt('बचत रक्कम (₹)', d.amt), mode, note]};
    if (d.type === 'loan') return {title:'कर्ज नोंद संपादन', f:[dt, amt('कर्ज रक्कम (₹)', d.amt), ['rate', 'num', 'व्याजदर (% प्रति महिना)', d.rate ?? cfg().rate], mode, note]};
    if (d.type === 'repay'){ const c0 = d.cash ?? (d.amt + (d.int || 0)); return {title:'हप्ता नोंद संपादन', f:[dt, amt('मुद्दल हप्ता (₹)', d.amt), ['int', 'num', 'व्याज देय/लागू (₹)', d.int || 0], ['recv', 'num', 'व्याज प्रत्यक्ष मिळाले (₹)', c0 - d.amt], mode, note]}; }
    if (d.type === 'bonus') return {title:'बोनस नोंद संपादन', f:[dt, amt('बोनस रक्कम (₹)', d.amt), ['reason', 'txt', 'कारण', d.reason || '']]};
  }
  if (c === 'members') return {title:'सभासद माहिती संपादन', f:[['name', 'txt', 'पूर्ण नाव', d.name], ['mobile', 'txt', 'मोबाईल', d.mobile || ''], ['joined', 'mon', 'सामील महिना (ऐच्छिक)', d.joined || '']]};
  if (c === 'notices') return {title:'सूचना संपादन', f:[['title', 'txt', 'शीर्षक', d.title], ['text', 'area', 'सूचना', d.text]]};
  if (c === 'exp') return {title:'खर्च संपादन', f:[dt, ['cat', 'cat', 'प्रकार', d.cat], amt('रक्कम (₹)', d.amt), mode, ['note', 'txt', 'तपशील', d.note || '']]};
  if (c === 'invtx') return {title:'गुंतवणूक व्याज/परत संपादन', f:[dt, ['kind', 'kind', 'काय मिळाले', d.kind], amt('रक्कम (₹)', d.amt), note]};
  if (c === 'invest') return {title:'गुंतवणूक योजना संपादन', f:[['name', 'txt', 'नाव', d.name], ['cat', 'icat', 'प्रकार', d.cat], ['amount', 'num', 'मुद्दल रक्कम (₹)' + (d.mode === 'monthly' ? ' प्रति महिना' : ''), d.amount], ['start', 'date', 'सुरुवात तारीख', d.start], note]};
  return null;
}

async function editSave(){
  const d = editDoc(), sp = d && editSpec(S.edit.c, d); if (!sp) { S.edit = null; return render(); }
  const g = k => val('e-' + k), data = {};
  for (const [k, t] of sp.f){
    if (k === 'recv') continue;
    if (t === 'num'){ const n = +g(k); if (!(n >= 0) || (['amt', 'amount'].includes(k) && !(n > 0))) return toast('रक्कम तपासा'); data[k] = n; }
    else { data[k] = g(k).trim ? g(k).trim() : g(k); if (t === 'date' && !data[k]) return toast('तारीख निवडा'); }
  }
  if (S.edit.c === 'tx' && d.type === 'repay'){ const rc = +g('recv'); if (!(rc >= 0)) return toast('रक्कम तपासा'); data.cash = data.amt + rc; }
  if (S.edit.c === 'tx' && d.type === 'inst') data.cash = data.amt;
  if (S.edit.c === 'members'){ if (!data.name) return toast('नाव भरा'); data.name = data.name.toUpperCase(); }
  if (S.edit.c === 'notices' && (!data.title || !data.text)) return toast('शीर्षक आणि सूचना भरा');

  const t = {yes:0, no:0, yesN:[], noN:[]};
  Object.entries(best).forEach(([acc, x]) => { if (x.v === 'yes'){ t.yes++; t.yesN.push(nameOf(+acc)); } else if (x.v === 'no'){ t.no++; t.noN.push(nameOf(+acc)); } });
  return t;
}
const myVote = id => { if (!S.me || !S.me.acc) return null; const d = S.votes.find(v => v.pid === S.pid) || null; return d && d.a && d.a[id] ? d.a[id].v : null; };

        <div class="b"><span>असहमत</span><em class="num">${t.no} (${pc(t.no)}%)</em><div class="track"><div class="fill" style="width:${pc(t.no)}%;background:var(--bad)"></div></div></div></div>

      ${S.admin ? `<details style="margin-top:10px"><summary class="hint" style="cursor:pointer">कोणी काय मत दिले (फक्त admin ला)</summary><div class="hint"><b>सहमत:</b> ${esc(t.yesN.join(', ') || '-')}<br><b>असहमत:</b> ${esc(t.noN.join(', ') || '-')}</div></details>

<script>
/* ================= auth (ID + password per member) ================= */
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(12)));
const genPw = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return [...crypto.getRandomValues(new Uint8Array(8))].map(x => c[x % 32]).join(''); };
async function hashPw(pw, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:150000, hash:'SHA-256'}, k, 256));
}
function remember(uid, h, s, t){ try { if (uid && uid !== 'admin') localStorage.setItem('soc_login', JSON.stringify({uid, h, s, t})); else localStorage.removeItem('soc_login'); } catch(e){} }
const loginOn = uid => { const p = S.perms[uid], m = S.members.find(x => uidFor(x.acc) === uid); return (!p || p.enabled !== false) && !(m && isExited(m.acc)); };
async function setCred(uid, pw, role, acc){
  const salt = newSalt(), hash = await hashPw(pw, salt);
  const keep = S.me && S.me.uid === uid && S.me.sess ? {sess:S.me.sess, sessTs:S.me.sessTs} : {};
  if (S.me && S.me.uid === uid){ S.me.h = hash; remember(uid, hash, S.me.sess, S.me.sessTs); }
  await S.db.doc('auth/' + uid).set(Object.assign({uid, salt, hash, role, acc: acc || 0, ts: Date.now()}, keep));
}
function refreshAdmin(){ S.admin = !!S.platformAdmin && !!S.me && S.me.role === 'admin'; }
function revalidate(){
  if (!S.me){
    try { const st = JSON.parse(localStorage.getItem('soc_login') || 'null'), a = st && S.auth[st.uid];
      if (a && a.uid !== 'admin' && a.hash === st.h && loginOn(a.uid) && (!a.sess || a.sess === st.s)){ S.me = {uid:a.uid, role:a.role, acc:a.acc, h:a.hash, sess:st.s, sessTs:st.t || 0}; if (pinRec(a.uid)){ S.locked = true; S.pinBuf = ''; } } } catch(e){}
  } else { const a = S.auth[S.me.uid]; if (!a || a.hash !== S.me.h || (a.role !== 'admin' && !loginOn(a.uid))){ S.me = null; remember(null); }
    else if (a.role !== 'admin' && S.me.sess && a.sess && a.sess !== S.me.sess && (a.sessTs || 0) > (S.me.sessTs || 0)){ S.me = null; S.locked = false; remember(null); S.loginMsg = 'या खात्याने दुसऱ्या फोनवर लॉगिन केले आहे. एका वेळी एकाच फोनवर लॉगिन चालते.'; } }
}
async function doLogin(){
  if (Date.now() < S.lockUntil){ S.loginMsg = 'काही वेळाने पुन्हा प्रयत्न करा.'; return render(); }
  const uid = $('l-id').value.trim().toLowerCase(), pw = $('l-pw').value, a = S.auth[uid];
  let ok = false;
  try { ok = !!a && (await hashPw(pw, a.salt)) === a.hash; } catch(e){ S.loginMsg = 'हे ब्राउझर लॉगिनला साथ देत नाही.'; return render(); }
  if (!ok){
    S.fails++;
    if (S.fails >= 5){ S.lockUntil = Date.now() + 30000; S.fails = 0; S.loginMsg = '५ वेळा चुकले. ३० सेकंद थांबा.'; } else S.loginMsg = 'आयडी किंवा पासवर्ड चुकीचा आहे.';
    render(); const p = $('l-pw'); if (p) p.value = ''; return;
  }
  if (a.role !== 'admin' && !loginOn(uid)){ S.loginMsg = 'तुमचे लॉगिन admin ने बंद केले आहे.'; return render(); }

/* ================= PDF share ================= */
async function sharePdf(rep, fname, text, to){
  try {
    toast('PDF बनवत आहे…');
    const blob = await renderPdf(rep), file = new File([blob], fname, {type:'application/pdf'});
    try { if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fname, text}); return true; } } catch(e){ if (e && e.name === 'AbortError') return; }
    if (!S.dl) return toast('या दृश्यात PDF सेव्ह होत नाही');
    await S.dl.save({filename:fname, data:blob}); toast(to ? 'PDF सेव्ह केले. ईमेल उघडत आहे, फाईल जोडा.' : 'PDF सेव्ह केले. आता WhatsApp मध्ये जोडा.');
    if (to){ const u = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(fname) + '&body=' + encodeURIComponent(text || ''); setTimeout(() => { location.href = u; }, 600); }
    return true;
  } catch(e){ if (e && e.code === 'declined') return; toast('PDF बनवता आले नाही'); }

/* ================= permissions ================= */
const permQ = {};
function stagePerm(uid, key, on){
  S.permDraft = S.permDraft || {};
  const cur = S.perms[uid] || {enabled:true, p:{}}, was = key === '__en' ? cur.enabled !== false : (permsOf(uid)[key] !== false);
  const d = Object.assign({}, S.permDraft[uid] || {});
  if (on === was) delete d[key]; else d[key] = on;
  if (Object.keys(d).length) S.permDraft[uid] = d; else delete S.permDraft[uid];
  render();
}
function permSave(uid){
  const dr = (S.permDraft || {})[uid]; if (!dr) return;
  const m = S.members.find(x => uidFor(x.acc) === uid), rows = [['सभासद', m ? m.acc + ' · ' + m.name : uid]];
  Object.entries(dr).forEach(([k, v]) => { const l = k === '__en' ? 'लॉगिन चालू' : (PERMS.find(p => p[0] === k) || [k, k])[1]; rows.push([l, v ? 'चालू' : 'बंद']); });
  ask('अधिकारातील बदल पक्के करायचे?', rows, async () => {
    const cur = S.perms[uid] || {enabled:true, p:{}}, p = Object.assign({}, cur.p || {});
    Object.entries(dr).forEach(([k, v]) => { if (k !== '__en') p[k] = v; });
    await S.db.doc('perms/' + uid).set({uid, enabled: '__en' in dr ? dr.__en : cur.enabled !== false, p});
    delete S.permDraft[uid]; toast('अधिकार जतन केले');
  }, {ok:'पक्के करा'});
}
function setPerm(uid, key, on){
  permQ[uid] = (permQ[uid] || Promise.resolve()).then(async () => {
    const cur = S.perms[uid] || {enabled:true, p:{}};
    const next = {uid, enabled: key === '__en' ? on : cur.enabled !== false, p: Object.assign({}, cur.p || {}, key === '__en' ? {} : {[key]: on})};
    try { await S.db.doc('perms/' + uid).set(next); } catch(e){ toast('बदल जतन झाला नाही'); render(); }
  });
}

  if (id === 'bk-month'){ S.bkMonth = t.value; return; }
  if (id === 'pf-file'){ pickPhoto(t.files && t.files[0]); return; }
  if (id === 'ln-acc' && $('ln-lim')){ $('ln-lim').textContent = limHint($('ln-acc').value); }
  if (id === 'f-acc' || id === 'f-date'){ S.en = {acc:+val('f-acc'), date:val('f-date') || today()}; ['h-amt','h-intr'].forEach(i => { const e = $(i); if (e) e.removeAttribute('data-keep'); }); render(); }
  else if (id === 'st-month'){ S.statusMonth = t.value; render(); }
  else if (id === 'x-fy'){ S.expFy = t.value; render(); }
  else if (id === 'pb-fy'){ S.pbFy = t.value; render(); }
  else if (id === 'rp-kind'){ S.rp.kind = t.value; render(); }
  else if (id === 'rp-period'){ S.rp.period = t.value; render(); }
  else if (id === 'rp-fy'){ S.rp.fy = t.value; render(); }
  else if (id === 'rp-month'){ S.rp.month = t.value; render(); }
  else if (id === 'rp-acc'){ S.rp.acc = t.value; render(); }
  else if (id === 'rp-from'){ S.rp.from = t.value; render(); }
  else if (id === 'rp-to'){ S.rp.to = t.value; render(); }
});

/* ================= app lock + auto sign-out ================= */
async function checkPin(){
  const r = S.me && pinRec(S.me.uid); let ok = false;
  try { ok = !!r && (await hashPw(S.pinBuf, r.salt)) === r.hash; } catch(e){}
  if (ok){ S.locked = false; S.pinBuf = ''; S.pinFails = 0; S.pinMsg = ''; checkPopup(); return render(); }
  S.pinFails = (S.pinFails || 0) + 1; S.pinBuf = '';
  if (S.pinFails >= 5){ try { localStorage.removeItem('soc_pin'); } catch(e){} S.me = null; S.locked = false; remember(null); S.loginMsg = '५ वेळा PIN चुकला. पासवर्डने लॉगिन करा.'; S.pinFails = 0; }
  else S.pinMsg = 'PIN चुकीचा आहे. (' + S.pinFails + '/5)';
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ S._hid = Date.now(); return; }
  const away = S._hid ? Date.now() - S._hid : 0; S._hid = 0;
  if (!S.me) return;
  if (away > 15000 && !S.locked){ S.tab = 'home'; S.sel = null; S.edit = null; }
  if (S.admin && away > 5 * 60000){ S.me = null; S.sel = null; S.tab = 'home'; S.creds = null; S.loginMsg = 'सुरक्षेसाठी admin लॉगआउट झाला. पुन्हा लॉगिन करा.'; render(); }
  else if (!S.admin && away > 60000 && pinRec(S.me.uid)){ S.locked = true; S.pinBuf = ''; S.pinMsg = ''; render(); }
  else if (away > 15000) render();
});

/* ================= boot ================= */
(async () => {
  render();
  const claude = window.claude;
  try { const user = claude && await claude.use('user'); S.platformAdmin = !!user && ((await user.canEdit()) || (await user.isOwner())); S.pid = user ? await user.id() : null; } catch(e){}
  try { S.dl = claude && await claude.use('downloads'); } catch(e){}
  const db = claude && await claude.use('db');
  if (!db){ S.err = 'कृपया claude.ai मध्ये लॉगिन करा. admin ने तुम्हाला आमंत्रित केलेले असावे.'; render(); return; }
  S.db = db;
  const names = ['members','tx','invest','invtx','exp','auth','perms','requests','decisions','settings','polls','votes','notices','profiles'], got = {};
  const upd = () => { S.ready = names.every(n => got[n]); if (S.ready){ revalidate(); refreshAdmin(); checkPopup(); } rerender(); };
  const fail = e => {
    if (e && /permission/.test(e.code || '')){ try { const t = +sessionStorage.getItem('soc_rl') || 0; if (Date.now() - t > 8000){ sessionStorage.setItem('soc_rl', String(Date.now())); S.ready = false; return location.reload(); } } catch(x){} }
    S.err = 'प्रवेश मिळाला नाही (' + (e && e.code || 'त्रुटी') + ').'; render(); };
  const arr = (n, key) => db.collection(n).onSnapshot(s => { S[key] = s.docs.map(d => Object.assign({}, d.data(), {id:d.id})); got[n] = 1; upd(); }, fail);
  const map = (n, key) => db.collection(n).onSnapshot(s => { S[key] = {}; s.docs.forEach(d => S[key][d.id] = d.data()); got[n] = 1; upd(); }, fail);
  arr('members','members'); arr('tx','tx'); arr('invest','invest'); arr('invtx','invtx'); arr('exp','exp');
  map('auth','auth'); map('perms','perms'); map('decisions','decisions'); arr('polls','polls'); arr('votes','votes'); arr('notices','notices'); map('profiles','profiles');
  if (S.platformAdmin) db.collection('pwreq').onSnapshot(s => { S.pwreqs = s.docs.map(d => d.data()); rerender(); }, () => {});
  if (S.platformAdmin) db.collection('requests').onSnapshot(s => { S.reqDocs = s.docs.map(d => d.data()); got.requests = 1; upd(); }, fail);
  else if (S.pid) db.doc('requests/' + S.pid).onSnapshot(s => { const v = s.exists ? s.data() : null; S.reqDocs = v ? [v] : []; got.requests = 1; upd(); }, () => { S.reqDocs = []; got.requests = 1; upd(); });
  else { S.reqDocs = []; got.requests = 1; }
  db.collection('settings').onSnapshot(s => { const m = s.docs.find(d => d.id === 'main'); S.settingsDoc = m ? m.data() : null; got.settings = 1; upd(); }, fail);
})();
</script>
