<script>
/* ================= constants ================= */
const MONTHS = ['जानेवारी','फेब्रुवारी','मार्च','एप्रिल','मे','जून','जुलै','ऑगस्ट','सप्टेंबर','ऑक्टोबर','नोव्हेंबर','डिसेंबर'];
const MSHORT = ['जाने','फेब्रु','मार्च','एप्रि','मे','जून','जुलै','ऑग','सप्टें','ऑक्टो','नोव्हें','डिसें'];
const TYPE = {inst:'मासिक बचत', loan:'कर्ज दिले', repay:'हप्ता भरला', bonus:'बोनस'};
const MODES = ['रोख','UPI','बँक','चेक'];
const INV_CATS = ['बँक एफडी','आरडी / मासिक योजना','शेअर बाजार','म्युच्युअल फंड','सोने','इतर'];
const EXP_CATS = ['स्टेशनरी / कागदपत्रे','बैठक / चहापान','बँक शुल्क','प्रवास / वाहतूक','कार्यक्रम','इतर'];
const PERMS = [
  ['members','सर्व सभासदांची यादी पाहणे'],
  ['passbooks','इतर सभासदांचे पासबुक / स्टेटमेंट पाहणे'],
  ['memberinfo','इतर सभासदांची अतिरिक्त माहिती (फोटो, पत्ता इ.) पाहणे'],
  ['status','भरणा स्थिती पाहणे'],
  ['loans','कर्ज नोंदवही पाहणे'],
  ['apply','कर्जासाठी ऑनलाइन अर्ज करणे'],
  ['tally','मासिक ताळेबंद पाहणे'],
  ['invest','गुंतवणूक पाहणे'],
  ['expenses','खर्च पाहणे'],
  ['bank','बँक खाते (जमा, व्याज, शुल्क) पाहणे'],
  ['income','नियमित उत्पन्न (भाडे, व्याज इ.) पाहणे'],
  ['bonus','बोनस पाहणे'],
  ['reports','अहवाल पाहणे'],
  ['pdf','पासबुक PDF / WhatsApp शेअर करणे'],
  ['polls','मतदान पाहणे आणि मत देणे'],
  ['notices','सूचना पाहणे'],
  ['loannotify','कर्ज अर्जाच्या सूचना (नवीन अर्ज, मंजूर, नाकारले, बदल) मिळणे'],
  ['collect','संकलन नोंदवणे: बचत, हप्ता, व्याज (admin सारखा लेखन अधिकार)'],
  ['loanwrite','नवीन कर्ज नोंदवणे (admin सारखा लेखन अधिकार)'],
  ['invest_w','गुंतवणूक योजना / व्याज नोंदवणे (admin सारखा लेखन अधिकार)'],
  ['bank_w','बँक नोंदी करणे: रोख जमा, व्याज, बँक शुल्क (admin सारखा लेखन अधिकार)'],
  ['expenses_w','खर्च नोंदवणे (admin सारखा लेखन अधिकार)'],
  ['bonus_w','नवीन बोनस वाटप करणे (संपादन/हटवणे फक्त admin)'],
  ['notice_w','सूचना प्रकाशित करणे (नाव सर्वांना दिसते)'],
  ['poll_w','मतदान तयार करणे / बंद करणे (नाव सर्वांना दिसते)'],
  ['entry_w','संकलनातील / कर्जाच्या नोंदी संपादन किंवा हटवणे (सहसा फक्त admin)'],
  ['members_w','सभासद जोडणे (नाव आणि मोबाईल बदलणे फक्त admin)'],
  ['member_exit','सभासदाला बाहेर काढणे (अंतिम हिशेब)'],
  ['backup','मासिक बॅकअप PDF काढणे / ईमेल करणे'],
  ['hometally','मुख्यपृष्ठावर सोसायटीचा ताळेबंद (शिल्लक, एकूण) पाहणे']
];
const WRITE_PERMS = ['collect', 'loanwrite', 'invest_w', 'expenses_w', 'bank_w', 'bonus_w', 'notice_w', 'poll_w', 'members_w', 'member_exit', 'entry_w', 'backup'];

  const mo = k => months[k] || (months[k] = {k, cashNet:0, inst:0, loan:0, prin:0, int:0, bonus:0, exp:0, inv:0, invint:0, invret:0, adj:0, exit:0, settled:0, n:0});

    const m = mo(e.date.slice(0,7)); cash += e.cash; m.cashNet += e.cash;

    else if (e.kind === 'repay'){ p.prin += e.amt; p.int += e.int; p.credit += e.adj; T.prin += e.amt; T.int += e.int; m.prin += e.amt; m.int += e.int; m.adj += e.adj; T.adj += e.adj; }

}

  const L = S.tx.filter(t => t.acc === acc && ['loan','repay','exit'].includes(t.type)).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0));
  let reg = 0, emg = 0;
  L.forEach(t => {
    if (t.type === 'loan'){ if (t.lk === 'emg') emg += t.amt; else reg += t.amt; }
    else if (t.type === 'repay'){ let r = t.amt || 0; if (t.lk === 'emg'){ const d = Math.min(emg, r); emg -= d; r -= d; reg = Math.max(0, reg - r); } else { const d = Math.min(reg, r); reg -= d; r -= d; emg = Math.max(0, emg - r); } }
    else { reg = 0; emg = 0; }

  return {reg, emg};
}

  const font = (sz, w = 400, f = FONT) => { cx.font = w + ' ' + sz + 'px ' + f; };
  const wrap = (t, w) => {
    t = trS(t); const out = []; let line = '';
    for (const tok of String(t).split(/(\s+)/)){
      if (cx.measureText(line + tok).width <= w){ line += tok; continue; }
      if (line.trim()) out.push(line.trim()); line = '';
      if (cx.measureText(tok).width <= w){ line = tok.trimStart(); continue; }

  };
  const tw = W - 2 * M, parts = rep.parts || [rep]; let cur = parts[0], cw = [];
  const setCur = p => { cur = p; const tot = p.cols.reduce((a,c) => a + c[1], 0); cw = p.cols.map(c => tw * c[1] / tot); };
  setCur(parts[0]);
  const drawRow = (cells, o) => {
    font(o.size, o.bold ? 700 : 400);
    const lines = cells.map((c,i) => wrap(c, cw[i] - 20)), h = Math.max(...lines.map(l => l.length)) * (o.size + 8) + 16;
    return {lines, h};
  };
  const paintRow = (cells, o, r) => {
    if (o.bg){ cx.fillStyle = o.bg; cx.fillRect(M, y, tw, r.h); }
    cx.fillStyle = o.color || '#14232B'; font(o.size, o.bold ? 700 : 400);
    let x = M;
    r.lines.forEach((ls, i) => { ls.forEach((ln, j) => { cx.textAlign = cur.cols[i][2] === 'r' ? 'right' : 'left'; cx.fillText(ln, cur.cols[i][2] === 'r' ? x + cw[i] - 10 : x + 10, y + 8 + (j + 1) * (o.size + 8) - 6); }); x += cw[i]; });
    cx.textAlign = 'left'; cx.strokeStyle = '#D9E1E0'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(M, y + r.h); cx.lineTo(M + tw, y + r.h); cx.stroke(); y += r.h;
  };
  newPage();
  cx.fillStyle = '#0B4F4A'; font(46, 700); cx.fillText('सर्वज्ञ सोसायटी, दत्तवाडी, मनेगाव', M, y + 44); y += 70;
  cx.fillStyle = '#14232B'; font(34, 700); cx.fillText(rep.title, M, y + 30); y += 46;
  cx.fillStyle = '#5C6E75'; font(26); wrap(rep.sub, tw).forEach(l => { cx.fillText(l, M, y + 26); y += 36; }); y += 10;
  if (rep.sum && rep.sum.length){
    const bw = (tw - 20) / 2;

        cx.fillStyle = '#0B4F4A'; font(30, 700); cx.fillText(s[1], x + 16, y + 64); });
      y += 92;

    y += 6;
  }
  const head = () => { const hc = cur.cols.map(c => c[0]), r = drawRow(hc, {size:22, bold:true}); if (y + r.h > H - M - 50) newPage(); paintRow(hc, {size:22, bold:true, bg:'#DCEFEC', color:'#0B4F4A'}, r); };
  parts.forEach((pt, pi) => {
    setCur(pt);

      if (y + 140 > H - M - 50) newPage(); else y += 18;

      if (!pt.rows.length){ cx.fillStyle = '#5C6E75'; font(24); cx.fillText('या कालावधीत नोंदी नाहीत.', M, y + 24); y += 40; return; }
    }
    head();

      const cells = row.map(String), r = drawRow(cells, {size:22});

    if (pt.foot){ const cells = pt.foot.map(String), r = drawRow(cells, {size:22, bold:true}); if (y + r.h > H - M - 50){ newPage(); head(); } paintRow(cells, {size:22, bold:true, bg:'#EEF2F1'}, r); }
  });
  pages.forEach((p, i) => { const c = p.getContext('2d'); c.fillStyle = '#5C6E75'; c.font = '400 20px ' + FONT; c.textAlign = 'left';
    c.fillText('तयार केले: ' + dlabel(today()) + ' · सर्वज्ञ सोसायटी', M, H - 36); c.textAlign = 'right'; c.fillText('पान ' + (i + 1) + ' / ' + pages.length, W - M, H - 36); });

}
function pdfFromCanvases(pages){
  const enc = s => new TextEncoder().encode(s), chunks = [], offs = []; let off = 0;
  const w = b => { chunks.push(b); off += b.length; }, ws = s => w(enc(s));
  const obj = (id, fn) => { offs[id] = off; ws(id + ' 0 obj\n'); fn(); ws('\nendobj\n'); };
  const n = pages.length;
  ws('%PDF-1.4\n');
  obj(1, () => ws('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => ws('<< /Type /Pages /Kids [' + pages.map((_, i) => (5 + 3 * i) + ' 0 R').join(' ') + '] /Count ' + n + ' >>'));
  pages.forEach((cv, i) => {
    const bin = atob(cv.toDataURL('image/jpeg', 0.9).split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    obj(3 + 3 * i, () => { ws('<< /Type /XObject /Subtype /Image /Width ' + cv.width + ' /Height ' + cv.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bytes.length + ' >>\nstream\n'); w(bytes); ws('\nendstream'); });
    const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(4 + 3 * i, () => ws('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
    obj(5 + 3 * i, () => ws('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ' + (3 + 3 * i) + ' 0 R >> >> /Contents ' + (4 + 3 * i) + ' 0 R >>'));
  });
  const total = 3 + 3 * n, xref = off;
  ws('xref\n0 ' + total + '\n0000000000 65535 f \n');
  for (let id = 1; id < total; id++) ws(String(offs[id]).padStart(10, '0') + ' 00000 n \n');
  ws('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, {type:'application/pdf'});
}
function waLink(mobile, text){
  let d = String(mobile || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d;

/* ================= bar chart ================= */
function barChart(C){
  if (!C.keys.length) return '';
  const last = C.keys[C.keys.length-1]; let [y,m] = last.split('-').map(Number); const win = [];
  for (let i = 0; i < 12; i++){ win.unshift(y + '-' + String(m).padStart(2,'0')); m--; if (m === 0){ m = 12; y--; } }
  const data = win.map(k => ({k, a:(C.months[k]||{}).inst||0, b:(C.months[k]||{}).loan||0}));
  const max = Math.max(1, ...data.flatMap(d => [d.a, d.b]));
  const step = Math.pow(10, Math.floor(Math.log10(max))); let top = Math.ceil(max/step)*step; if (top/step < 3) top = Math.ceil(max/(step/2))*(step/2);
  const W = 360, H = 190, L = 38, B = 24, T = 8, pw = W - L - 6, ph = H - B - T, gw = pw/12; let g = '';
  for (let i = 0; i <= 4; i++){ const v = top*i/4, yy = T + ph - ph*i/4;
    g += `<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${yy+3.5}" font-size="9.5" text-anchor="end">${v >= 100000 ? (v/100000)+'L' : v >= 1000 ? (v/1000)+'k' : v}</text>`; }
  data.forEach((d,i) => { const x = L + i*gw, bw = gw*0.32, h1 = ph*d.a/top, h2 = ph*d.b/top;
    g += `<rect x="${x+gw*0.14}" y="${T+ph-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--accent)"/><rect x="${x+gw*0.14+bw+1.5}" y="${T+ph-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--gold)"/>`;
    g += `<text x="${x+gw/2}" y="${H-8}" font-size="8.5" text-anchor="middle">${MSHORT[+d.k.slice(5)-1]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="महिन्यानुसार बचत आणि कर्ज">${g}</svg>`;
}

const pollClosed = p => !!p.closed || (!!p.end && today() > p.end);
function pollTally(id){
  /* secret ballot: choices live in "ballots" (no member identity); "votes" only records WHO has voted (no choice). Old votes that still carry a choice are counted too. */
  const t = {yes:0, no:0};
  S.ballots.filter(b => b.poll === id).forEach(b => { if (b.v === 'yes') t.yes++; else if (b.v === 'no') t.no++; });
  const best = {};
  S.votes.forEach(d => { const x = d.a && d.a[id]; if (x && x.v && (!best[d.acc] || x.ts < best[d.acc].ts)) best[d.acc] = x; });
  Object.values(best).forEach(x => { if (x.v === 'yes') t.yes++; else if (x.v === 'no') t.no++; });
  return t;
}
const myChoice = id => { try { return (JSON.parse(localStorage.getItem(uKey('soc_myv')) || '{}'))[id] || ''; } catch(e){ return ''; } };
const myVote = id => { if (!S.me || !S.me.acc) return null; const d = S.votes.find(v => v.acc === S.me.acc && v.a && v.a[id]); return d ? (d.a[id].v || myChoice(id) || 'voted') : null; };

    return `<div class="card" style="margin-top:12px"><div class="row-b" style="justify-content:space-between;align-items:flex-start"><b style="overflow-wrap:anywhere">${esc(p.q)}</b><span class="pill ${closed ? '' : 'good'}">${closed ? 'बंद' : 'चालू'}</span></div>

<script>

const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(12)));
const genPw = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return [...crypto.getRandomValues(new Uint8Array(8))].map(x => c[x % 32]).join(''); };
async function hashPw(pw, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:150000, hash:'SHA-256'}, k, 256));
}
function remember(uid, h, s, t){ try { if (uid && uid !== 'admin') localStorage.setItem('soc_login', JSON.stringify({uid, h, s, t})); else localStorage.removeItem('soc_login'); } catch(e){} }
const loginOn = uid => { const p = S.perms[uid], m = S.members.find(x => uidFor(x.acc) === uid); return (!p || p.enabled !== false) && !(m && isExited(m.acc)); };
const loginOf = uid => (S.auth[uid] && S.auth[uid].login) || uid;
function uidByLogin(t){ t = String(t || '').trim().toLowerCase(); if (S.auth[t]) return t; const k = Object.keys(S.auth).find(u => String(S.auth[u].login || '').toLowerCase() === t); return k || t; }
function loginTaken(login, uid){ const t = String(login).toLowerCase(); return Object.keys(S.auth).some(u => u !== uid && (u.toLowerCase() === t || String(S.auth[u].login || '').toLowerCase() === t)); }
async function setCred(uid, pw, role, acc){
  const salt = newSalt(), hash = await hashPw(pw, salt);
  const keep = Object.assign(S.me && S.me.uid === uid && S.me.sess ? {sess:S.me.sess, sessTs:S.me.sessTs} : {}, S.auth[uid] && S.auth[uid].login ? {login:S.auth[uid].login} : {});
  if (S.me && S.me.uid === uid){ S.me.h = hash; remember(uid, hash, S.me.sess, S.me.sessTs); }
  await S.db.doc('auth/' + uid).set(Object.assign({uid, salt, hash, role, acc: acc || 0, ts: Date.now()}, keep));
}
function refreshAdmin(){ S.admin = !!S.platformAdmin && !!S.me && S.me.role === 'admin'; }
function revalidate(){

  } else { const a = S.auth[S.me.uid]; if (!a || a.hash !== S.me.h || (a.role !== 'admin' && !loginOn(a.uid))){ S.me = null; remember(null); }
    else if (a.role !== 'admin' && S.me.sess && a.sess && a.sess !== S.me.sess && (a.sessTs || 0) > (S.me.sessTs || 0)){ S.me = null; S.locked = false; remember(null); S.loginMsg = 'या खात्याने दुसऱ्या फोनवर लॉगिन केले आहे. एका वेळी एकाच फोनवर लॉगिन चालते.'; } }
}
async function doLogin(){

  if (f[2] === 'd'){ const x = new Date(Date.UTC(y, m - 1, d + n * f[1])); return x.toISOString().slice(0, 10); }
  const t = (m - 1) + n * f[1], yy = y + Math.floor(t / 12), mm = ((t % 12) + 12) % 12, dim = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
  return yy + '-' + String(mm + 1).padStart(2, '0') + '-' + String(Math.min(d, dim)).padStart(2, '0');
}
function incSched(inc, upTo){
  const f = inc && FREQ[inc.freq]; if (!f || !inc.from || !(inc.amt > 0)) return null;
  let n = 0; while (n < 4000 && addPeriod(inc.from, f, n) <= upTo) n++;
  return {n, expected:n * inc.amt, next:addPeriod(inc.from, f, n), last:n ? addPeriod(inc.from, f, n - 1) : ''};
}

const LOCK_COLS = {tx:'entry_w', exp:'entry_w', invtx:'entry_w', bank:'bank_w', invest:'invest_w'};
const lockMs = ts => { const h = +setAt('lockHrs', ts); return (isNaN(h) ? 24 : Math.max(0, h)) * 3600 * 1000; };
const lockMsFor = (c, ts) => { const k = c === 'exp' ? 'lockDaysExp' : (c === 'invest' || c === 'invtx') ? 'lockDaysInv' : null, v = k ? setAt(k, ts) : ''; return k && v !== '' && v != null && !isNaN(+v) ? Math.max(0, +v) * 86400000 : lockMs(ts); };
const entryDoc = (c, id) => ({tx:S.tx, exp:S.exp, invtx:S.invtx, bank:S.bank, invest:S.invest}[c] || []).find(x => x.id === id) || null;
function entryMode(c, id){
  const none = {edit:'none', del:'none'}, d = entryDoc(c, id);
  if (!d || !LOCK_COLS[c] || !S.me || !canW(LOCK_COLS[c])) return none;
  if (c === 'tx' && (d.type === 'bonus' || d.bn)) return {edit:'none', del:'none', why:'bonus'};
  if ((S.chg || []).some(r => r.status === 'pending' && r.col === c && r.docId === id)) return {edit:'none', del:'none', why:'pending'};
  if (!(d.ts && Date.now() - d.ts < lockMsFor(c, d.ts))) return {edit:'none', del:'none', why:'locked'};
  const isReqLoan = c === 'tx' && d.type === 'loan' && d.rid, md = (c === 'tx' && d.acc != null) || !S.admin ? 'req' : 'direct';
  return {edit: isReqLoan ? 'none' : (editSpec(c, d) ? md : 'none'), del: md, why: isReqLoan ? 'loanreq' : ''};
}
/* the member who "owns" an entry: the member of a collection entry, otherwise the member who recorded it (null when admin recorded it) */
function holderAcc(c, d){
  if (c === 'tx' && d.acc != null) return d.acc;
  const u = d.byUid || (typeof d.by === 'string' && /^m\d+$/.test(d.by) ? d.by : ''); if (!u || u === 'admin') return null;
  const m = S.members.find(x => uidFor(x.acc) === u); return m ? m.acc : null;
}
function entryLabel(c, d){

async function sharePdf(rep, fname, text, to){
  try {
    toast('PDF बनवत आहे…');
    const blob = await renderPdf(rep), file = new File([blob], fname, {type:'application/pdf'});
    try { if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fname, text}); return true; } } catch(e){ if (e && e.name === 'AbortError') return; }

    if (to){ const u = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(fname) + '&body=' + encodeURIComponent(text || ''); setTimeout(() => { location.href = u; }, 600); }

/* ================= phone back button: history-based navigation ================= */
let navStack = [{tab:'home', sel:null}], navIdx = 0, navPop = false;
try { history.replaceState({i:0}, ''); } catch(e){}
const _render0 = render;
render = function(){ _render0(); navSync(); };
function navSync(){
  if (navPop){ navPop = false; return; }
  if (!S.me){ if (navStack.length > 1 || navIdx){ navStack = [{tab:'home', sel:null}]; navIdx = 0; try { history.replaceState({i:0}, ''); } catch(e){} } return; }
  const cur = {tab:S.tab, sel:S.sel}, top = navStack[navIdx], prev = navStack[navIdx - 1];
  if (prev && (top.tab !== cur.tab || top.sel !== cur.sel) && prev.tab === cur.tab && prev.sel === cur.sel){ navIdx--; try { history.back(); } catch(e){} return; }
  if (top.tab !== cur.tab || top.sel !== cur.sel){ navStack = navStack.slice(0, navIdx + 1); navStack.push(cur); navIdx++; try { history.pushState({i:navIdx}, ''); } catch(e){} }
}

window.backPress = function(){

  if (S.tab !== 'home' && S.me){ S.tab = 'home'; return render(); }

cided in the \"Entry\" when the loan is given. The rate below is only a suggested (default) rate.","दर महिन्याची रक्कम सोसायटीच्या शिल्लकीतून वजा होईल. थांबवण्यासाठी योजनेवर “मासिक गुंतवणूक थांबवा” दाबा.":"The monthly amount will be deducted from the society balance. To stop it, press \"Stop monthly investment\" on the plan.","आपत्कालीन कर्जाची संपूर्ण रक्कम पुढील हप्ता तारखेला एकाच हप्त्यात वसूल होते. त्यावर १ महिन्याचे व्याज लागते.":"The full emergency loan is recovered in one installment on the next installment date. One month's interest is charged on it.","आयडी खाते क्रमांकावरून ठरतो (उदा. m001). पासवर्ड विसरल्यास “नवीन पासवर्ड” दाबा. अधिकार “सभासद अधिकार” मध्ये ठरवा.":"The ID is based on the account number (e.g. m001). If a password is forgotten, press \"New password\". Set permissions in \"Member permissions\".","ऐच्छिक. ४ अंकी PIN ठेवल्यास ॲप उघडताना (आणि बराच वेळ बाजूला राहिल्यावर) PIN विचारला जाईल. PIN फक्त या फोनवर राहतो.":"Optional. If you set a 4-digit PIN, it is asked when opening the app (and after a long time away). The PIN stays only on this phone.","ही नोंद केल्यावर सभासदाचे लॉगिन बंद होईल आणि पुढील संकलनातून तो वगळला जाईल. चूक झाल्यास “बाहेर पडणे रद्द करा” वापरा.":"After this entry the member's login will be disabled and they will be left out of future collections. If it was a mistake, use \"Cancel exit\".","सह) घेतलेल्या कर्जाचे त्याच महिन्याच्या हप्त्यात १ महिन्याचे व्याज लागते. त्यानंतरच्या कर्जाचे व्याज पुढील महिन्याच्या हप्त्यापासून.":") is charged 1 month's interest in that same month's installment. Loans taken after that are charged from the next month's installment.","सर्वज्ञ सोसायटी, दत्तवाडी, मनेगावतर्फे तुम्हाला वाढदिवसाच्या मनःपूर्वक शुभेच्छा. तुमचे आयुष्य आनंदाचे, आरोग्याचे आणि भरभराटीचे जावो!":"Warm birthday wishes to you from Sarvadnya Society, Dattawadi, Manegaon. May your life be full of joy, health and prosperity!","प्रति सभासद (सेटिंग्जमधून बदलता येते). कमी भरलेली रक्कम पुढील महिन्यात “मागील बाकी” म्हणून दिसते. जास्तीची रक्कम “क्रेडिट” म्हणून जमा राहते.":"Per member (can be changed in Settings). Any short amount shows as \"previous balance\" next month. Any extra amount stays as \"credit\".","या तारखेपर्यंत (ती धरून) घेतलेल्या कर्जाचे त्याच महिन्याच्या हप्त्यात १ महिन्याचे व्याज लागते. त्यानंतरच्या कर्जाचे व्याज पुढील महिन्याच्या हप्त्यापासून.":"A loan taken up to this date (including it) is charged 1 month's interest in that same month's installment. Loans after it are charged from the next month's installment.","जास्त किंवा कमी व्याज फरक त्या सभासदाच्या क्रेडिटमध्ये जातो आणि पुढील महिन्यात जुळवता येतो. फक्त व्याजाचा फरकच क्रेडिटमध्ये जातो. नवीन कर्ज “कर्ज” टॅबमधून द्या.":"An interest difference, more or less, goes to that member's credit and can be adjusted next month. Only the interest difference goes to credit. Give a new loan from the \"Loans\" tab.","दर महिन्याच्या २० तारखेनंतर admin लॉगिन केल्यावर मुख्यपृष्ठावर “बॅकअप पाठवा” ची आठवण दिसते. पूर्ण आपोआप ईमेल (ॲप बंद असतानाही) साठी सर्व्हर लागतो; तो या ॲपमध्ये नाही.":"After the 20th of every month a \"send backup\" reminder appears on the home page when the admin logs in. Fully automatic email (even when the app is closed) needs a server, which this app does not have.","निवडलेल्या महिन्याच्या सर्व नोंदी, सभासदनिहाय स्थिती, कर्ज, खर्च, गुंतवणूक आणि संपर्क यादी असलेली एक PDF शीट. ॲप चालत नसेल तेव्हा या शीटवरून हिशेब हाताने जुळवता येतो.":"One PDF sheet with all entries of the chosen month, member-wise status, loans, expenses, investments and the contact list. When the app is not working, the accounts can be tallied manually from this sheet.","“ईमेल करा” दाबल्यावर फोनची शेअर यादी उघडते. तिथे Gmail निवडा. PDF आपोआप जोडलेली येते आणि ईमेल आयडी विषयाच्या वर लिहिलेला दिसतो. शेअर यादी न उघडल्यास PDF सेव्ह होऊन ईमेल ॲप उघडते.":"When you press \"Email\", the phone's share list opens. Choose Gmail there. The PDF comes attached automatically and the email ID is written above the subject. If the share list does not open, the PDF is saved and the email ","रक्कम आधीच्या श्रेणीच्या कमालपेक्षा १ ने जास्त आपोआप ठरते, त्यामुळे मध्ये गॅप किंवा ओव्हरलॅप होत नाही. फक्त":"amount is set automatically to 1 more than the previous slab's max, so there is no gap or overlap. Just enter","भरा. शेवटची श्रेणी पुढे कितीही रकमेसाठी लागू. व्याज वेगळे.":"them. The last slab applies to any amount above. Interest is separate."};
const LANG_RE = (() => {
  const keys = Object.keys(EN_DICT).sort((a, b) => b.length - a.length), esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(?<![\\u0900-\\u097F])(' + keys.map(esc).join('|') + ')(?![\\u0900-\\u097F])', 'g');
})();
const HAS_MR = /[\u0900-\u097F]/;
function trS(s){ if (S.lang !== 'en' || s == null) return s; s = String(s); return HAS_MR.test(s) ? s.replace(LANG_RE, m => EN_DICT[m] || m) : s; }
const _trNodes = new Map();
function applyLang(){
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'mr';
  const lb = document.getElementById('lang'); if (lb){ lb.textContent = S.lang === 'en' ? 'मराठी' : 'EN'; lb.setAttribute('aria-label', S.lang === 'en' ? 'मराठी भाषा' : 'English language'); }
  if (S.lang !== 'en'){
    /* back to Marathi: restore every static text/attribute (e.g. the society name in the header) that was translated before */
    _trNodes.forEach((o, n) => { if (n.isConnected) n.nodeValue = o; }); _trNodes.clear();
    document.querySelectorAll('[data-mr]').forEach(e => { try { const m = JSON.parse(e.getAttribute('data-mr')); Object.keys(m).forEach(k => e.setAttribute(k, m[k])); } catch(x){} e.removeAttribute('data-mr'); });
    return;
  }
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => { const p = n.parentNode && n.parentNode.nodeName; return p === 'SCRIPT' || p === 'STYLE' || p === 'TEXTAREA' || !HAS_MR.test(n.nodeValue) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; } });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { _trNodes.set(n, n.nodeValue); n.nodeValue = trS(n.nodeValue); });
  for (const [n] of _trNodes) if (!n.isConnected) _trNodes.delete(n);
  document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(e => ['placeholder', 'aria-label', 'title', 'alt'].forEach(a => { const v = e.getAttribute(a); if (v && HAS_MR.test(v)){ let m = {}; try { m = JSON.parse(e.getAttribute('data-mr') || '{}'); } catch(x){} m[a] = v; e.setAttribute('data-mr', JSON.stringify(m)); e.setAttribute(a, trS(v)); } }));
}
try { S.lang = localStorage.getItem('soc_lang') === 'en' ? 'en' : 'mr'; } catch(e){ S.lang = 'mr'; }
const _renderL = render; render = function(){ _renderL(); applyLang(); };
const _toastL = toast; toast = function(m){ return _toastL(trS(m)); };
const _sharePdfL = sharePdf; sharePdf = function(rep, fname, text, to){ return _sharePdfL(rep, fname, trS(text), to); };
document.addEventListener('click', ev => { if (ev.target.closest('[data-act=lang]')){ S.lang = S.lang === 'en' ? 'mr' : 'en'; try { localStorage.setItem('soc_lang', S.lang); } catch(e){} render(); } });
/* ================= phone notifications (APK only: window.fbNotify is provided by fblayer.js) =================
   A notification is posted when a NEW notice / poll / loan decision (member) or a NEW loan application (admin) arrives while the app is running. */
function notifyScan(){
  if (!window.fbNotify || !S.ready || !S.me) return;
  const key = 'soc_nt2_' + S.me.uid; let st = null; try { st = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){}
  const reqs = allRequests(), cur = {n:S.notices.map(x => x.id), p:S.polls.map(x => x.id), d:{}, r:[], f:{}};
  (S.loanfeed || []).forEach(f => { cur.f[f.id] = f.status + ':' + f.amt; });
  if (S.admin) reqs.filter(r => r.status === 'pending').forEach(r => cur.r.push(r.id));
  else if (S.me.acc) reqs.filter(r => r.acc === S.me.acc).forEach(r => { cur.d[r.id] = r.status + ':' + r.amt; });
  if (st && st.f && can('loannotify') && !window.fbPushOn) (S.loanfeed || []).forEach(f => { if (f.byUid === S.me.uid) return; const pv = st.f[f.id], now = f.status + ':' + f.amt; if (pv !== now) fbNotify(lfTitle(f), lfText(f)); });
  if (st){
    if (!S.admin){
      if (can('notices') && !window.fbPushOn) S.notices.filter(x => !(st.n || []).includes(x.id) && (!x.due || x.due >= today())).forEach(x => fbNotify('सूचना: ' + x.title, x.text + (x.by ? ' — ' + x.by : '')));
      if (can('polls') && !window.fbPushOn) S.polls.filter(x => !(st.p || []).includes(x.id) && !pollClosed(x)).forEach(x => fbNotify('नवीन मतदान' + (x.by ? ' (' + x.by + ')' : ''), x.q));
    }
  }
  try { localStorage.setItem(key, JSON.stringify(cur)); } catch(e){}
  try {
    const bk = 'soc_nbd_' + S.me.uid, bl = bdayToday();
    if (bl.length && localStorage.getItem(bk) !== today()){ localStorage.setItem(bk, today()); const me = S.me.acc ? bl.find(m => m.acc === S.me.acc) : null;
      fbNotify(me ? 'वाढदिवसाच्या हार्दिक शुभेच्छा' : 'आज वाढदिवस आहे!', me ? 'सर्वज्ञ सोसायटीकडून तुम्हाला शुभेच्छा' : bl.map(m => m.name).join(', ')); }
  } catch(e){}
}
const _checkPopupL = checkPopup; checkPopup = function(){ _checkPopupL(); try { notifyScan(); } catch(e){} };
